<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --success: #34a853;
      --danger: #ea4335;
      --warning: #fbbc04;
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #dadce0;
      --text: #202124;
      --text-secondary: #5f6368;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab:hover {
      background: rgba(0,0,0,0.02);
      color: var(--primary);
    }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Content Area */
    .content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .tab-content {
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards & Buttons */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .section-title {
      margin: 0 0 12px 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    
    .btn {
      display: block;
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn i { margin-right: 8px; font-size: 16px; }
    
    .btn:hover:not(:disabled) {
      background: rgba(26, 115, 232, 0.04);
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .btn.primary {
      background: var(--primary);
      color: white;
      border: none;
      justify-content: center;
      text-align: center;
    }
    .btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Progress UI */
    .progress-container {
      display: none;
      margin-top: 16px;
    }
    .progress-status {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .progress-wrapper {
      width: 100%;
      background: var(--border);
      border-radius: 4px;
      height: 16px;
      position: relative;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }
    .log-area {
      width: 100%;
      height: 120px;
      background: #f1f3f4;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      font-size: 11px;
      font-family: monospace;
      overflow-y: auto;
      box-sizing: border-box;
    }

    /* Toasts */
    #toast-container {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 1000;
    }
    .toast {
      background: #323232;
      color: white;
      padding: 12px 16px;
      border-radius: 4px;
      margin-top: 8px;
      font-size: 13px;
      box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px 0 rgba(0,0,0,.14), 0 1px 18px 0 rgba(0,0,0,.12);
      animation: slideUp 0.3s ease forwards;
    }
    .toast.error { background: var(--danger); }
    .toast.success { background: var(--success); }
    
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* Loader inside buttons */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: currentColor;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('asosiy')">Asosiy</div>
    <div class="tab" onclick="switchTab('ommaviy')">Ommaviy</div>
    <div class="tab" onclick="switchTab('tools')">Sozlamalar</div>
  </div>

  <div class="content">
    
    <!-- ASOSIY TAB -->
    <div id="tab-asosiy" class="tab-content active">
      <div class="section">
        <h4 class="section-title">Tanlangan Qator (Active Row)</h4>
        <button class="btn" onclick="runAction('openFolderPickerForActiveRow', this)">📁 Folder tanlash</button>
        <button class="btn primary" onclick="runAction('createActForActiveRow', this)">⚡ Akt yaratish</button>
        <button class="btn" onclick="runAction('syncActForActiveRow', this)">🔄 Aktni yangilash (Sync)</button>
        <button class="btn" onclick="runAction('moveActForActiveRow', this)">📦 Folderga ko'chirish</button>
      </div>
    </div>

    <!-- OMMAVIY TAB -->
    <div id="tab-ommaviy" class="tab-content">
      <div class="section" id="bulk-buttons">
        <h4 class="section-title">Ommaviy Harakatlar</h4>
        
        <div style="margin-bottom: 16px; font-size: 13px;">
          <div style="margin-bottom: 6px; font-weight: 500;">Qamrovni tanlang:</div>
          <label style="display: block; margin-bottom: 4px; cursor: pointer;">
            <input type="radio" name="bulkScope" value="selected" checked> Faqat belgilangan qatorlar
          </label>
          <label style="display: block; cursor: pointer;">
            <input type="radio" name="bulkScope" value="visible"> Barcha ochiq qatorlar (Filtrdagi)
          </label>
        </div>

        <button class="btn primary" onclick="startBulk('create')">⚡ Yaratish</button>
        <button class="btn" onclick="startBulk('sync')">🔄 Yangilash</button>
        <button class="btn" onclick="startBulk('move')">📦 Ko'chirish</button>
      </div>

      <div class="section progress-container" id="bulk-progress">
        <h4 class="section-title" id="bulk-title">Jarayon...</h4>
        <div class="progress-status" id="bulk-status">Loading rows...</div>
        <div class="progress-wrapper">
          <div class="progress-bar" id="bulk-bar"></div>
        </div>
        <div class="log-area" id="bulk-log"></div>
        <br>
        <button class="btn" onclick="cancelBulk()" id="bulk-cancel">To'xtatish</button>
      </div>
    </div>

    <!-- TOOLS TAB -->
    <div id="tab-tools" class="tab-content">
      <div class="section">
        <h4 class="section-title">Avto & Monitor</h4>
        <button class="btn" onclick="runAction('autoEnable', this)">▶ Avto Yoqish (onEdit)</button>
        <button class="btn" onclick="runAction('autoDisable', this)">⏹ Avto O'chirish</button>
        <button class="btn" onclick="runAction('monitorEnable', this)">▶ Monitor Yoqish (15m)</button>
        <button class="btn" onclick="runAction('monitorDisable', this)">⏹ Monitor O'chirish</button>
        <button class="btn" onclick="runAction('monitor_run', this)">🔎 Hozir tekshirish</button>
      </div>
      
      <div class="section">
        <h4 class="section-title">Tizim</h4>
        <button class="btn" onclick="runAction('da_refreshAll', this)">📊 Dashboard Yangilash</button>
        <button class="btn" onclick="runAction('importRootToReyestr', this)">📥 Root import qilish</button>
        <button class="btn" onclick="runAction('setupAll', this)">✅ Setup qilish</button>
        <button class="btn" onclick="runAction('healthCheck', this)">🧪 Tizim holati (Health)</button>
        <button class="btn" onclick="runAction('akt_repairFolderPathDisplay', this)">🧹 Folder manzillarini sozlash</button>
      </div>
    </div>

  </div>

  <div id="toast-container"></div>

  <script>
    // Tab Switching
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    // Toast Notifications
    function showToast(message, type='normal') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerText = message;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Single Actions
    function runAction(funcName, btn) {
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Jarayon...`;
      
      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          btn.innerHTML = originalText;
          if (res && res.error) showToast(res.error, 'error');
          else if (res && res.message) showToast(res.message, 'success');
          else showToast('Muvaffaqiyatli yakunlandi!', 'success');
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerHTML = originalText;
          showToast(err.message || 'Xatolik yuz berdi', 'error');
        })
        [funcName]();
    }

    // Bulk Operations
    let bulkMode = '';
    let rowsData = []; // [{row: 2, retries: 0}]
    let currentIndex = 0;
    let completedCount = 0;
    let activeWorkers = 0;
    let isCancelled = false;

    const MAX_CONCURRENT = 3;
    const MAX_RETRIES = 3;

    const titles = { 'create': 'Ommaviy Yaratish', 'sync': 'Ommaviy Yangilash', 'move': 'Ommaviy Ko\'chirish' };

    function logMsg(msg, isError=false) {
      const el = document.getElementById('bulk-log');
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.innerText = `[${time}] ${msg}`;
      if (isError) div.style.color = 'var(--danger)';
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    function startBulk(mode) {
      const scopeEls = document.getElementsByName('bulkScope');
      let scope = 'selected';
      for (const el of scopeEls) { if (el.checked) scope = el.value; }

      bulkMode = mode;
      isCancelled = false;
      rowsData = [];
      currentIndex = 0;
      completedCount = 0;
      activeWorkers = 0;
      
      document.getElementById('bulk-buttons').style.display = 'none';
      document.getElementById('bulk-progress').style.display = 'block';
      document.getElementById('bulk-title').innerText = titles[mode] + " (Tezkor rejim)";
      document.getElementById('bulk-status').innerText = "Qatorlar qidirilmoqda...";
      document.getElementById('bulk-bar').style.width = '0%';
      document.getElementById('bulk-log').innerHTML = '';
      document.getElementById('bulk-cancel').innerText = "To'xtatish";
      
      google.script.run
        .withSuccessHandler(rows => {
          if (!rows || rows.length === 0) {
            document.getElementById('bulk-status').innerText = 'Mos qatorlar topilmadi.';
            document.getElementById('bulk-cancel').innerText = 'Orqaga';
            return;
          }
          rowsData = rows.map(r => ({ row: r, retries: 0 }));
          logMsg(`Topildi: ${rows.length} ta qator. Bir vaqtda ${MAX_CONCURRENT} ta qator ishlanadi.`);
          processNext();
        })
        .withFailureHandler(err => {
          document.getElementById('bulk-status').innerText = 'Xatolik yuz berdi.';
          logMsg(err.message, true);
          document.getElementById('bulk-cancel').innerText = 'Orqaga';
        })
        .getVisibleRowsForBulk(mode, scope);
    }

    function cancelBulk() {
      if (document.getElementById('bulk-cancel').innerText === 'Orqaga' || document.getElementById('bulk-cancel').innerText === 'Yopish') {
        document.getElementById('bulk-buttons').style.display = 'block';
        document.getElementById('bulk-progress').style.display = 'none';
      } else {
        isCancelled = true;
        logMsg('Jarayon to\'xtatildi. Qolgan jarayonlar tugatilishini kuting...', true);
        document.getElementById('bulk-cancel').innerText = 'Orqaga';
      }
    }

    function processNext() {
      if (isCancelled && activeWorkers === 0) {
        document.getElementById('bulk-status').innerText = 'Tugatildi.';
        return;
      }
      
      if (currentIndex >= rowsData.length && activeWorkers === 0) {
        document.getElementById('bulk-status').innerText = 'Barcha qatorlar yakunlandi!';
        document.getElementById('bulk-bar').style.width = '100%';
        logMsg('Muvaffaqiyatli tugatildi.');
        document.getElementById('bulk-cancel').innerText = 'Yopish';
        showToast('Ommaviy jarayon yakunlandi', 'success');
        return;
      }

      while (activeWorkers < MAX_CONCURRENT && currentIndex < rowsData.length) {
        if (isCancelled) break;
        const taskObj = rowsData[currentIndex++];
        runTask(taskObj);
      }
    }

    function runTask(taskObj) {
      activeWorkers++;
      updateProgressUI();
      
      google.script.run
        .withSuccessHandler(res => {
          activeWorkers--;
          if (res.error) {
            handleTaskFailure(taskObj, res.error);
          } else {
            completedCount++;
            logMsg(`Qator ${taskObj.row}: OK`);
            updateProgressUI();
            processNext();
          }
        })
        .withFailureHandler(err => {
          activeWorkers--;
          handleTaskFailure(taskObj, err.message);
        })
        .executeBulkRowAction(bulkMode, taskObj.row);
    }
    
    function handleTaskFailure(taskObj, errorMsg) {
      if (isCancelled) {
         processNext();
         return;
      }
      if (taskObj.retries < MAX_RETRIES) {
         taskObj.retries++;
         logMsg(`Qator ${taskObj.row}: Xato (${errorMsg}). Qayta urinilmoqda (${taskObj.retries}/${MAX_RETRIES})...`, true);
         setTimeout(() => {
           if (!isCancelled) runTask(taskObj);
         }, 2000);
      } else {
         completedCount++; // Mark done but failed
         logMsg(`Qator ${taskObj.row}: Muaffaqiyatsiz (${errorMsg})`, true);
         updateProgressUI();
         processNext();
      }
    }
    
    function updateProgressUI() {
       const pct = rowsData.length === 0 ? 0 : Math.floor((completedCount / rowsData.length) * 100);
       document.getElementById('bulk-bar').style.width = pct + '%';
       document.getElementById('bulk-status').innerText = `Tugatildi: ${completedCount} / ${rowsData.length} (Jarayonda: ${activeWorkers})`;
    }
  </script>
</body>
</html>
